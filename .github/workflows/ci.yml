name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ruff
        run: |
          python3 -m venv .venv-ruff
          .venv-ruff/bin/pip install ruff==0.17.5
          .venv-ruff/bin/ruff check .

      - name: privacy scan
        run: ./scripts/privacy_scan.sh

      - name: unit tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v

      - name: install
        run: |
          python3 -m venv .venv
          .venv/bin/pip install .

      - name: entry point sec
        run: |
          .venv/bin/sec --help >/dev/null
          .venv/bin/python -m sec_gate --help >/dev/null

      - name: entry point sec-mcp
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05"}}' \
            | SEC_BIN="$PWD/.venv/bin/sec" timeout 5 .venv/bin/sec-mcp > /tmp/mcp-handshake.json
          grep -q '"result"' /tmp/mcp-handshake.json
          grep -q '"serverInfo"' /tmp/mcp-handshake.json

      - name: smoke
        run: SEC_BIN=.venv/bin/sec ./scripts/smoke.sh